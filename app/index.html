<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURA</title>
<link rel="manifest" href="manifest.json?v=130">
<meta name="theme-color" content="#0a5078">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/common.css?v=130">
<link rel="stylesheet" href="css/erika.css?v=130">
<!-- Modus früh setzen (kein Flackern der falschen Startseite) -->
<script>
(function(){
  var m = 'patient';
  try { var s = JSON.parse(localStorage.getItem('neuroar_settings')); if (s && s.mode) m = s.mode; } catch(e){}
  document.documentElement.setAttribute('data-mode', m);
})();
</script>
<style>
/* Randabstand (oben 5 %, rechts 5 %) IMMER aktiv, unabhängig vom Modus
   (vorher nur im Einfach-Modus über common.css/--free-*). */
.top-actions { position:absolute; top:5dvh; right:5vw; z-index:20; display:flex; align-items:center; gap:0.5rem; }
/* Quadratisch, gleiche Größe/Eckenradius/Farbe wie der "?"-Button (.erika-help-btn) */
.profile-btn { background:#fff; border:none; color:#1a1a2e; border-radius:14px;
  width:5.5rem; height:5.5rem; display:flex; align-items:center; justify-content:center;
  font-size:3.2rem; cursor:pointer; text-decoration:none; box-shadow:0 6px 14px rgba(0,0,0,0.45); }

/* Erweitert-Modus: Einstellungen- und "?"-Button etwas kleiner (nur hier,
   Einfach-Modus bleibt bei der ursprünglichen Größe). */
html[data-mode="pflege"] .profile-btn,
html[data-mode="pflege"] .erika-help-btn { width:4.5rem; height:4.5rem; font-size:2.6rem; }

/* Modus-Umschaltung: nur der aktive Teil ist sichtbar
   (display via Klasse, nicht inline — sonst schlägt Inline die :none-Regel) */
.patient-only, .pflege-only { display:flex; flex-direction:column; align-items:center; gap:1.125rem; }
.pflege-only { width:100%; }
html[data-mode="patient"] .pflege-only { display:none; }
html[data-mode="pflege"]  .patient-only { display:none; }

/* Kacheln (.game-tiles/.game-tile) für die Kategorienauswahl kommen aus
   common.css — dort gemeinsam mit der Tiere-Seite und der Stufenauswahl
   in Suchen/Verfolgen/Lenken, damit alle exakt gleich groß sind. */

/* Ein großer "Spiel starten"-Button — Patienten-Modus */
.start-btn { background:#85d67d; color:#111; border:none; border-radius:22px;
  padding:calc(clamp(1.35rem,6vw,2.1rem) + var(--optische-mitte)) clamp(2.25rem,10.8vw,3.9rem) calc(clamp(1.35rem,6vw,2.1rem) - var(--optische-mitte)); font-size:clamp(1.35rem,6vw,1.8rem);
  font-weight:600; cursor:pointer; box-shadow:0 10px 26px rgba(0,0,0,0.45);
  display:flex; align-items:center; gap:0.625rem; }
.start-btn:active { transform:scale(0.98); }

/* Tages-Fortschrittsbalken */
.daily { width:100%; max-width:560px; }
.daily-top { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; }
.daily-title { color:rgba(255,255,255,0.7); font-size:0.975rem; }
.daily-label { color:#fff; font-size:0.975rem; font-variant-numeric:tabular-nums; }
.daily-bar-bg { width:100%; height:10px; background:rgba(255,255,255,0.3); border-radius:6px; overflow:hidden; }
.daily-bar { height:100%; width:0%; background:#000; border-radius:6px; transition:width .4s; }
.daily-done { color:#34d399; font-size:0.9rem; margin-top:6px; text-align:center; display:none; }
.daily-done.show { display:block; }

/* Einfach-Startseite: "Spiel starten" und Tages-Balken auf eine gemeinsame
   Breite (25rem) bringen; Balken etwas höher, Text dazu etwas größer.
   (Das Maß stammt vom früheren Sensor-Knopf, der hier stand; die Breite
   wurde beibehalten, weil sie sich bewährt hat.)
   Der Titel bekommt dieselbe Breite, damit "AURA" (text-align:center aus
   common.css) mittig über dem Button steht statt (wegen der linksbündigen
   Neglect-Spalte, .home-col oben) am linken Rand zu kleben. */
html[data-mode="patient"] .title,
html[data-mode="patient"] .start-btn,
html[data-mode="patient"] .daily     { width:25rem; max-width:100%; }
html[data-mode="patient"] .start-btn { justify-content:center; }
html[data-mode="patient"] .daily-bar-bg { height:16px; }
html[data-mode="patient"] .daily-title,
html[data-mode="patient"] .daily-label  { font-size:1.2rem; }

</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('neuroar_settings'));document.documentElement.setAttribute('data-fontsize',(s&&s.fontSize)||'mittel');if(s&&s.colorblindMode)document.documentElement.setAttribute('data-colorblind','true');}catch(e){}})();</script>
</head>
<body>
<div id="app">
  <div class="screen active home">
    <div class="cam-bg"></div>
    <div class="top-actions">
      <a class="profile-btn" href="settings.html" aria-label="Einstellungen"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></a>
    </div>
    <div class="home-col" style="position:relative;z-index:10;display:flex;flex-direction:column;gap:1.125rem;">
      <div class="title">AURA</div>

      <!-- Patienten-Modus: ein großer Spielen-Knopf -->
      <div class="patient-only">
        <button class="start-btn" id="startBtn"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg> Spiel starten</button>
      </div>

      <!-- Pflegekraft-Modus: Kategorienauswahl (aktuell nur "Tiere" verlinkt) -->
      <div class="pflege-only">
        <div class="sub">Wähle einen Bereich</div>
        <div class="game-tiles">
          <a class="game-tile" href="tiere.html">
            <div class="ic"><img src="assets/Marienkaefer.webp" alt=""></div>
            <div class="tname">Tiere</div>
          </a>
          <div class="game-tile soon" role="button" aria-disabled="true" onclick="showComingSoon()">
            <div class="tname">Essen</div>
          </div>
          <div class="game-tile soon" role="button" aria-disabled="true" onclick="showComingSoon()">
            <div class="tname">Fotos</div>
          </div>
        </div>
      </div>

      <div class="daily">
        <div class="daily-bar-bg"><div class="daily-bar" id="daily-bar"></div></div>
        <div class="daily-top">
          <span class="daily-title">Heutiges Training</span>
          <span class="daily-label" id="daily-label">0 / 20 min</span>
        </div>
        <div class="daily-done" id="daily-done"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Tagesziel erreicht!</div>
      </div>

    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* Kurze Meldung für noch nicht verfügbare Bereiche (Essen/Fotos).
   Eigene kleine Fassung, weil diese Seite common.js (mit zeigeToast) nicht
   einbindet — das Aussehen kommt aber aus derselben .toast-Regel in
   common.css wie überall sonst.

   ⚠️ Der Name lautet bewusst NICHT toastTimer: so heißt die Variable in
   common.js, und zwar als `let`. Bindet jemand common.js hier zusätzlich ein
   (naheliegend, sobald diese Seite z. B. vibrate() braucht), kollidieren `let`
   und `var` unter demselben Namen im globalen Gültigkeitsbereich — das ist ein
   SyntaxError, der ALLE Skripte der Seite abschaltet, nicht nur dieses. */
var comingSoonTimer = null;
function showComingSoon() {
  var toast = document.getElementById('toast');
  toast.textContent = 'Bald verfügbar';
  toast.classList.add('show');
  clearTimeout(comingSoonTimer);
  comingSoonTimer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
}
</script>
<script src="js/settings.js?v=130"></script>
<script src="js/session.js?v=130"></script>
<script src="js/erika.js?v=130"></script>
<script>Erika.startCollapsed();</script>
<script src="js/orientation.js?v=130"></script>
<!-- flow.js: stellt Flow.starten() bereit (wuerfelt die Reihenfolge). Nach
     settings.js, weil es die Einstellung "Audio-Uebungen" liest. -->
<script src="js/flow.js?v=130"></script>
<script>
/* "Spiel starten" holt die Sensor-Freigabe und startet dann den Flow.

   Der frühere Knopf "Bewegungssteuerung aktivieren" ist entfernt. Er war nur
   nötig, solange die Freigabe eine eigene Nutzer-Geste brauchte — genau die
   liefert der Start-Knopf hier aber ohnehin, und das ist die Stelle, auf die
   iOS wartet. Auf Android erscheint dabei kein Dialog (siehe Kommentar in
   suchen.js zu requestPermission). Schlägt die Freigabe fehl, wird trotzdem
   gestartet: die Übungen fallen dann auf Finger-Steuerung zurück. */
(function () {
  var startBtn = document.getElementById('startBtn');
  if (!startBtn) return;
  startBtn.addEventListener('click', function () {
    /* Flow.starten() wuerfelt die Reihenfolge der neun Uebungen neu, legt sie
       ab und springt zur ersten — welche Seite das ist, steht also erst hier
       fest (frueher immer suchen.html?flow=0). */
    function go() { Flow.starten(); }
    if (window.OrientationControl && OrientationControl.isAvailable() &&
        typeof OrientationControl.requestPermission === 'function') {
      OrientationControl.requestPermission().then(go).catch(go);
    } else {
      go();
    }
  });
})();
</script>
<script>
(function () {
  const goalMin = getDailyGoalMinutes();
  const goalSec = goalMin * 60;
  const done = getTodaySeconds();
  const pct = goalSec > 0 ? Math.min(100, done / goalSec * 100) : 0;
  const doneMin = Math.floor(done / 60);
  document.getElementById('daily-label').textContent = doneMin + ' / ' + goalMin + ' min';
  document.getElementById('daily-bar').style.width = pct + '%';
  if (pct >= 100) document.getElementById('daily-done').classList.add('show');
})();
</script>
</body>
</html>
