<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NeuroAR Reha — Tiere</title>
<link rel="stylesheet" href="css/common.css?v=55">
<link rel="stylesheet" href="css/erika.css?v=55">
<style>
/* Kacheln (.game-tiles/.game-tile) kommen aus common.css — dort gemeinsam
   mit der Erweitert-Startseite und der Stufenauswahl in Suchen/Verfolgen/
   Lenken, damit alle exakt gleich groß sind. */

/* "Zurück zum Menü" auf dieser Seite wie der "?"-Button: weiß + Schatten
   (nur hier überschrieben, common.css/.back-to-menu bleibt für alle anderen
   Seiten unverändert). */
.back-to-menu { background:#fff; color:#1a1a2e; border:none; box-shadow:0 6px 14px rgba(0,0,0,0.45); }

/* Erweitert-Modus: "?"-Button etwas kleiner (diese Seite gibt es nur im
   Erweitert-Modus, daher hier ohne data-mode-Bedingung). */
.erika-help-btn { width:4.5rem; height:4.5rem; font-size:2.6rem; }
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('neuroar_settings'));document.documentElement.setAttribute('data-fontsize',(s&&s.fontSize)||'mittel');if(s&&s.colorblindMode)document.documentElement.setAttribute('data-colorblind','true');}catch(e){}})();</script>
</head>
<body>
<div id="app">
  <div class="screen active home">
    <div class="cam-bg"></div>
    <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;align-self:stretch;gap:1.125rem;">
      <div class="title">Tiere</div>
      <div class="sub">Wähle eine Übung</div>
      <div class="game-tiles">
        <a class="game-tile" href="suchen.html">
          <div class="ic"><img src="assets/suchen_icon.svg" alt="Suchen"></div>
          <div class="tname">Suchen</div>
        </a>
        <a class="game-tile" href="verfolgen.html">
          <div class="ic"><img src="assets/verfolgen_icon.svg" alt="Verfolgen"></div>
          <div class="tname">Verfolgen</div>
        </a>
        <a class="game-tile" href="lenken.html">
          <div class="ic"><img src="assets/lenken_icon.svg" alt="Lenken"></div>
          <div class="tname">Lenken</div>
        </a>
      </div>
      <a class="back-to-menu" href="index.html"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Zurück zum Menü</a>
    </div>
  </div>
</div>
<script src="js/session.js?v=55"></script>
<script src="js/erika.js?v=55"></script>
<script>Erika.startCollapsed();</script>
</body>
</html>
