<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURA — Verfolgen</title>
<link rel="manifest" href="manifest.json?v=133">
<meta name="theme-color" content="#0a5078">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/common.css?v=133">
<link rel="stylesheet" href="css/verfolgen.css?v=133">
<link rel="stylesheet" href="css/erika.css?v=133">
<link rel="stylesheet" href="css/intro.css?v=133">
<!-- Geführter Modus (?flow=n): Auswahl-Screen sofort verstecken, bevor er aufblitzen kann -->
<script>if (new URLSearchParams(location.search).has('flow')) document.documentElement.classList.add('flow-mode');</script>
<style>
.flow-mode #screen-home { display:none !important; }
/* "Zurück"-Buttons auf dieser Seite wie der "?"-Button: weiß + Schatten
   (nur hier überschrieben, common.css/.back-to-menu bleibt für alle anderen
   Seiten unverändert). */
.back-to-menu { background:#fff; color:#1a1a2e; border:none; box-shadow:0 6px 14px rgba(0,0,0,0.45); }
/* "?"-Button: Erweitert-Modus (Standalone, kein flow-mode) etwas kleiner,
   im geführten Einfach-Modus (flow-mode) normale Größe. */
.erika-help-btn { width:4.5rem; height:4.5rem; font-size:2.6rem; }
html.flow-mode .erika-help-btn { width:5.5rem; height:5.5rem; font-size:3.2rem; }
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('neuroar_settings'));document.documentElement.setAttribute('data-fontsize',(s&&s.fontSize)||'mittel');if(s&&s.colorblindMode)document.documentElement.setAttribute('data-colorblind','true');}catch(e){}})();</script>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen active home">
    <div class="cam-bg"></div>
    <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;align-self:stretch;gap:1.125rem;">
      <div class="title">Verfolgen</div>
      <div class="sub">Bewege das Tablet, um das Tier in der Mitte zu halten</div>
      <div class="cards cards-row">
        <div class="card" data-stage="1" onclick="beginStage(1)">
          <div class="ic"><img class="outlined" src="assets/schmetterling.png" alt=""></div>
          <div class="card-title">Übung 1</div>
          <div class="card-sub">Visuell</div>
        </div>
        <div class="card" data-stage="2" onclick="beginStage(2)">
          <div class="ic"><img class="outlined" src="assets/uhu.svg" alt=""></div>
          <div class="card-title">Übung 2</div>
          <div class="card-sub">Audio-visuell</div>
        </div>
        <div class="card" data-stage="3" onclick="beginStage(3)">
          <div class="ic"><img class="outlined" src="assets/schmetterling.svg" alt=""></div>
          <div class="card-title">Übung 3</div>
          <div class="card-sub">Verschwinden</div>
        </div>
      </div>
      <button class="btn-permission" id="perm-btn" onclick="requestSensorPermission()" style="display:none;">Bewegungssensor aktivieren</button>
      <a class="back-to-menu" href="tiere.html"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Zurück zur Tierauswahl</a>
      <a class="back-to-menu" href="index.html"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Zurück zum Menü</a>
    </div>
  </div>

  <div id="screen-level" class="screen">
    <div class="cam-bg"></div>
    <div class="audio-bars" id="audio-bars" style="display:none;">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="audio-label" id="audio-label" style="display:none;">Ton-Richtung</div>
    <div class="center-zone" id="zone"><span class="cz-label">Ziel</span></div>
    <div class="target" id="obj">💎</div>
    <!-- Kopfblock: Hinweistext und was direkt darunter gehoert. Gemeinsamer
         Block, damit die Kinder zueinander zentriert sind (siehe .hud in
         common.css) — im gefuehrten Modus sitzt er an der 40-%-Kante. -->
    <div class="hud">
      <div class="instr" id="instr">Halte das Objekt im Kreis</div>
      <div class="timer-bar-bg"><div class="timer-bar" id="timer-bar"></div></div>
    </div>
    <div class="success" id="success">
      <!-- .s-col haelt Text und Buttons zusammen: dadurch sind sie
           zueinander zentriert, auch wenn der Block im gefuehrten Modus
           linksbuendig an der 40-%-Kante sitzt (siehe common.css). -->
      <div class="s-col">
        <div class="s-text" id="success-text"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg> Zeit abgelaufen!</div>
        <div class="s-sub" id="success-sub"></div>
        <button class="next-btn" onclick="onNext()">Nochmal</button>
        <button class="menu-btn" onclick="goHome()">Beenden</button>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js?v=133"></script>
<script src="js/erika.js?v=133"></script>
<script>Erika.startCollapsed();</script>
<script src="js/intro.js?v=133"></script>
<script src="js/badges.js?v=133"></script>
<script src="js/settings.js?v=133"></script>
<script src="js/session.js?v=133"></script>
<script src="js/orientation.js?v=133"></script>
<script src="js/kamera.js?v=133"></script>
<script src="js/verfolgen.js?v=133"></script>
<script src="js/flow.js?v=133"></script>
</body>
</html>
